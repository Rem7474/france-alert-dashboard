name: Déploiement GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"   # chaque lundi : rafraîchit les données Eurostat/BCE
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Récupération des données en direct (repli sur le snapshot en cas d'échec)
        run: npm run fetch || echo "::warning::API indisponible, utilisation du snapshot versionné"
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
